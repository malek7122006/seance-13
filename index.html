<!DOCTYPE html> 
<html lang="fr"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Ma To-Do List</title> 
 
    <link rel="stylesheet" href="style.css"> 

    <!-- ✅ Bonne pratique : le CSS est placé dans un fichier séparé. -->
</head> 
 
<body> 
 
    <div class="container"> 
 
        <h1>  To Do List</h1> 
 
        <!-- 💡 Le titre est clair. Vous pouvez cependant supprimer les espaces inutiles avant le texte. -->
 
        <div class="input-box"> 
            <input type="text" id="taskInput" placeholder="Écrire une tâche..."> 
            <input type="date" id="taskdate"> 
            <button id="addButton">Ajouter</button> 

            <!-- 🌟 Bonne idée d'avoir ajouté une date à chaque tâche : c'est une fonctionnalité supplémentaire intéressante. -->
        </div> 
 
        <ul id="taskList"> 
        </ul> 

        <!-- ✅ La balise <ul> est adaptée pour afficher dynamiquement la liste des tâches. -->
 
    </div> 
 
    <script src="script.js"></script> 

    <!-- ✅ Le JavaScript est correctement séparé dans un fichier externe. -->
</body> 
</html>
